name: Build or publish a reviewed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (vX.Y.Z); publish only after integration review'
        required: true
        type: string
      publish:
        description: 'Publish this reviewed image to Docker Hub'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build exact source with explicit fixed parent
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IMAGE="$REPOSITORY:${VERSION#v}"
          docker build --tag "$IMAGE" .
          docker image inspect "$IMAGE" --format '{{.Id}}'
      - name: Publish after explicit dispatch choice
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
          docker push "$REPOSITORY:${VERSION#v}"
